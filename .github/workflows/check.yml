# yds 자동 빌드 + 전체 검사 (2026-11-08 사용자 "ds 가 수정되면 자동으로 사이트 싱크")
#   main 에 올라오면: 원본(DS, site/src, 템플릿 생성기)으로 토큰, 템플릿, 사이트를 다시 만들어
#   바뀐 생성물이 있으면 자동 커밋해 올린 뒤, 전체 검사(tools/check.mjs --regen)를 돈다.
#   PR 에서는 다시 만들기 없이 검사만 한다.
#   자동 커밋은 GITHUB_TOKEN 으로 올리므로 이 작업을 다시 부르지 않는다. 로컬에서는 시작할 때 git pull.
name: yds 검사
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
concurrency:
  group: yds-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 생성물 다시 만들기 (DS → 사이트)
        if: github.event_name == 'push'
        run: |
          DATE=$(grep -o '생성: [0-9-]*' tokens/tokens.js | head -1 | cut -d' ' -f2)
          node tokens/build.mjs $DATE
          node tools/brands.mjs
          node site/templates/gen/run.mjs
          node site/build.mjs
      - name: 바뀐 생성물 자동 커밋
        if: github.event_name == 'push'
        run: |
          git add -A dist tokens site
          if git diff --cached --quiet; then
            echo "바뀐 생성물 없음"
          else
            git config user.name "yds-bot"
            git config user.email "yds-bot@users.noreply.github.com"
            git commit -q -m "자동: DS 원본에 맞춰 사이트, 토큰 생성물 다시 만들기"
            git push
          fi
      - run: node tools/check.mjs --regen
