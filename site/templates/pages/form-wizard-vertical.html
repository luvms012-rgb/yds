<body>
<div class="tp-app">
<header class="tp-head" style="align-items: center"><span class="tp-h4">새 교재 등록</span><div class="tp-row"><button type="button" class="ds-btn" data-variant="neutralWeak" data-size="small"><i class="ds-icon ds-icon--save" aria-hidden="true"></i>임시 저장</button><button type="button" class="ds-btn" data-variant="ghost" data-size="small"><i class="ds-icon ds-icon--x" aria-hidden="true"></i>나가기</button></div></header>
<div class="tp-vw">
  <nav class="tp-vw__steps" aria-label="등록 단계"><ol class="ds-stepper" data-orientation="vertical" aria-label="등록 단계"><li class="ds-stepper__step" data-state="complete"><span class="ds-stepper__indicator"></span><span class="ds-stepper__label">저자 정보</span></li><li class="ds-stepper__step" data-state="current" aria-current="step"><span class="ds-stepper__indicator"></span><span class="ds-stepper__label">교재 정보</span></li><li class="ds-stepper__step"><span class="ds-stepper__indicator"></span><span class="ds-stepper__label">표지와 샘플</span></li><li class="ds-stepper__step"><span class="ds-stepper__indicator"></span><span class="ds-stepper__label">음원 파일</span></li><li class="ds-stepper__step"><span class="ds-stepper__indicator"></span><span class="ds-stepper__label">가격과 판매</span></li><li class="ds-stepper__step"><span class="ds-stepper__indicator"></span><span class="ds-stepper__label">검토와 출판</span></li></ol></nav>
  <main class="tp-vw__main">
    <div class="tp-stack"><h1 class="tp-h1">교재 정보</h1></div>
    <div class="tp-form">
      <div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="b-title">교재 제목 <span class="ds-field__required" aria-hidden="true"></span></label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="b-title" placeholder="" value="한 달 만에 끝내는 비즈니스 영어"></div></div>
      <div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="b-sub">부제</label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="b-sub" placeholder="선택 사항" ></div></div>
      <div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="b-author">지은이 <span class="ds-field__required" aria-hidden="true"></span></label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="b-author" placeholder="" value="와이비엠"></div></div>
      <div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="b-narr">읽은 사람</label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="b-narr" placeholder="성우 이름" ></div></div>
      <div class="tp-pair"><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="b-ed">판</label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="b-ed" placeholder="2판" ></div></div><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="b-lang">언어</label></div><button type="button" class="ds-select" data-size="medium" id="b-lang" aria-haspopup="listbox" aria-expanded="false"><span class="ds-select__value">한국어</span></button></div></div>
      <div class="tp-pair"><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="b-series">시리즈</label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="b-series" placeholder="시리즈 이름" ></div></div><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="b-no">시리즈 순서</label></div><div class="tp-num-input"><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="b-no" placeholder="1" type="number" min="1"></div></div></div></div>
